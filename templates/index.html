<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="logo">💰</span>
                <span>Personal Finance Tracker</span>
            </div>
            <div class="month-picker">
                <label for="month">Month</label>
                <input type="month" id="month">
            </div>
        </div>
    </header>

    <main class="container">
        <section class="summary">
            <div class="card summary-card income">
                <span class="summary-label">Income</span>
                <span class="summary-value" id="sum-income">$0.00</span>
            </div>
            <div class="card summary-card expense">
                <span class="summary-label">Expenses</span>
                <span class="summary-value" id="sum-expenses">$0.00</span>
            </div>
            <div class="card summary-card balance">
                <span class="summary-label">Balance</span>
                <span class="summary-value" id="sum-balance">$0.00</span>
            </div>
        </section>

        <div class="grid">
            <div class="col">
                <section class="card">
                    <h2>Add Transaction</h2>
                    <form id="tx-form" class="tx-form" novalidate>
                        <div class="field-row">
                            <div class="field">
                                <label for="tx-type">Type</label>
                                <select id="tx-type" required>
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>
                            <div class="field">
                                <label for="tx-amount">Amount</label>
                                <input type="number" id="tx-amount" step="0.01"
                                       min="0.01" placeholder="0.00" required>
                            </div>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <label for="tx-category">Category</label>
                                <select id="tx-category" required></select>
                            </div>
                            <div class="field">
                                <label for="tx-date">Date</label>
                                <input type="date" id="tx-date" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="tx-description">Description (optional)</label>
                            <input type="text" id="tx-description" maxlength="200"
                                   placeholder="e.g. Groceries at Walmart">
                        </div>
                        <button type="submit" class="btn btn-primary">Add transaction</button>
                        <span id="form-error" class="error" hidden></span>
                    </form>
                </section>

                <section class="card">
                    <h2>Transactions</h2>
                    <ul id="tx-list" class="tx-list"></ul>
                    <p id="tx-empty" class="empty" hidden>No transactions for this month yet.</p>
                </section>
            </div>

            <div class="col">
                <section class="card">
                    <h2>Expenses by Category</h2>
                    <div class="chart-wrap">
                        <canvas id="categoryChart"></canvas>
                        <p id="chart-empty" class="empty" hidden>No expenses this month.</p>
                    </div>
                </section>

                <section class="card">
                    <h2>Budgets</h2>
                    <form id="budget-form" class="budget-form" novalidate>
                        <select id="budget-category" required></select>
                        <input type="number" id="budget-amount" step="0.01"
                               min="0" placeholder="Limit" required>
                        <button type="submit" class="btn btn-primary">Set</button>
                    </form>
                    <ul id="budget-list" class="budget-list"></ul>
                    <p id="budget-empty" class="empty" hidden>No budgets set.</p>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Built with Flask, HTML, CSS &amp; JavaScript.</p>
    </footer>
</body>
</html>
